<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Workspace</title><link rel="preconnect" href="https://googleapis.com"><link rel="preconnect" href="https://gstatic.com" crossorigin><link href="https://googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet"><style>:root{--bg:#0A0B07;--card:#14170F;--olive:#585B0A;--lime:#D3D858;--peony:#CE75A1;--dew:#F8FFED;--label:#7E856D}*{box-sizing:border-box;margin:0;padding:0;font-family:'Fredoka',sans-serif;-webkit-tap-highlight-color:transparent}body{background:var(--bg);color:var(--dew);padding:16px}.wrap{max-width:440px;margin:0 auto}h1{font-size:24px;text-align:center;margin-bottom:20px;color:var(--dew)}h2{font-size:16px;color:var(--lime);margin-bottom:14px}.box{background:var(--card);border:1px solid var(--olive);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 4px 16px rgba(0,0,0,0.4)}label{display:block;font-size:11px;color:var(--label);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px}.row{position:relative;display:flex;align-items:center;margin-bottom:12px}.sign{position:absolute;left:12px;color:var(--lime);font-weight:600}input,textarea{width:100%;background:var(--bg);border:1px solid var(--olive);color:var(--dew);padding:12px;border-radius:10px;font-size:16px;outline:none}input.sign-pad{padding-left:26px}input:focus,textarea:focus{border-color:var(--lime)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.item{background:var(--bg);padding:10px;border-radius:8px;border-bottom:2px solid var(--olive)}.wide{grid-column:span 2;border-color:var(--peony)}.val{font-size:18px;font-weight:600;margin-top:2px}.feed{background:var(--bg);border:1px solid var(--olive);border-radius:10px;max-height:220px;overflow-y:auto}.match{padding:10px;border-bottom:1px solid rgba(88,91,10,0.2)}.match:last-child{border-bottom:none}.m-meta{display:flex;justify-content:space-between;margin-bottom:2px;font-weight:600}.m-sum{color:var(--lime)}.m-qty{color:var(--peony);font-size:12px}.m-det{font-size:13px;opacity:0.8;word-break:break-all}btn{background:var(--olive);color:var(--dew);border:none;padding:14px;border-radius:10px;font-size:15px;font-weight:600;width:100%;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:8px}btn:active{opacity:0.8}.pny{background:var(--peony);color:var(--bg)}.g-row{display:flex;align-items:center;justify-content:between;background:var(--bg);padding:12px;border-radius:8px;margin-bottom:6px;border:1px solid var(--olive)}.del{color:var(--peony);background:none;border:none;font-size:20px;font-weight:700;padding-left:10px}</style></head><body><div class="wrap"><h1>Active Workspace</h1><div class="box"><h2>💰 Savings Projections</h2><label>Savings Rate Amount</label><div class="row"><span class="sign">$</span><input type="number" id="rate" class="sign-pad" value="25.00" oninput="calcProjections()"></div><div class="grid"><div class="item"><label>Per Day</label><div class="val" id="d">$0.00</div></div><div class="item"><label>Per Week</label><div class="val" id="w">$0.00</div></div><div class="item"><label>Per Month</label><div class="val" id="m">$0.00</div></div><div class="item"><label>Per Quarter</label><div class="val" id="q">$0.00</div></div><div class="item wide"><label>Per Year Projection</label><div class="val" id="y">$0.00</div></div></div></div><div class="box"><h2>🎯 Range Matcher Target</h2><label>Target Payout Goal</label><div class="row"><span class="sign">$</span><input type="number" id="tgt" class="sign-pad" value="100.00" oninput="matchEngine()"></div><label>Tolerance Window (± Offset)</label><div class="row"><span class="sign">$</span><input type="number" id="tol" class="sign-pad" value="2.00" step="0.25" oninput="matchEngine()"></div><label>Active Order Pool (Comma Separated)</label><textarea id="pool" rows="3" oninput="matchEngine()">14.23, 8.50, 41.12, 19.99, 25.50, 12.00, 33.45</textarea><label style="margin:10px 0 6px 0">Optimized Options Found</label><div class="feed" id="out"></div></div><div class="box"><h2>🏁 Goal Milestones</h2><div id="gFeed"></div><label style="margin-top:10px">New Milestone Title</label><input type="text" id="gIn" placeholder="e.g., Secure $1,000 Tier"><btn class="pny" onclick="addMilestone()">＋ Save Milestone</btn></div><div class="box" style="border-style:dashed"><p style="font-size:12px;color:var(--label);margin-bottom:8px">Data auto-saves locally to browser profiles.</p><btn onclick="exportStr()">📋 Clipboard String Export</btn><btn style="background:transparent;border:1px solid var(--olive)" onclick="importStr()">📥 Load String Backup</btn></div></div><script>let goals=["Hit $500 Weekly Reserve Fund","Clear high target ceiling tier"];window.onload=function(){if(localStorage.getItem('r'))document.getElementById('rate').value=localStorage.getItem('r');if(localStorage.getItem('t'))document.getElementById('tgt').value=localStorage.getItem('t');if(localStorage.getItem('o'))document.getElementById('tol').value=localStorage.getItem('o');if(localStorage.getItem('p'))document.getElementById('pool').value=localStorage.getItem('p');if(localStorage.getItem('g')){try{goals=JSON.parse(localStorage.getItem('g'))||[]}catch(e){}}calcProjections();matchEngine();drawGoals();};function calcProjections(){let a=parseFloat(document.getElementById('rate').value)||0;localStorage.setItem('r',a);document.getElementById('d').innerText=`$${a.toFixed(2)}`;document.getElementById('w').innerText=`$${(a*7).toFixed(2)}`;document.getElementById('m').innerText=`$${(a*30.42).toFixed(2)}`;document.getElementById('q').innerText=`$${(a*91.25).toFixed(2)}`;document.getElementById('y').innerText=`$${(a*365).toFixed(2)}`}function matchEngine(){let t=parseFloat(document.getElementById('tgt').value)||0,o=parseFloat(document.getElementById('tol').value)||0,p=document.getElementById('pool').value||"",f=document.getElementById('out');if(!f)return;localStorage.setItem('t',t);localStorage.setItem('o',o);localStorage.setItem('p',p);let lo=t-o,hi=t+o,items=p.split(',').map(x=>parseFloat(x.trim())).filter(x=>!isNaN(x)&&x>0&&x<=hi);if(items.length===0){f.innerHTML=`<div style="padding:12px;text-align:center;color:var(--label);font-size:13px;">Awaiting order numbers...</div>`;return}let res=[];let lim=Math.min(items.length,14),pool=items.slice(0,lim),combos=1<<pool.length;for(let i=1;i<combos;i++){let sub=[],sum=0;for(let j=0;j<pool.length;j++){if((i&(1<<j))!==0){sub.push(pool[j]);sum+=pool[j]}}if(sum>=lo&&sum<=hi){res.push({tot:parseFloat(sum.toFixed(2)),cnt:sub.length,det:sub.map(n=>`$${n.toFixed(2)}`).join(' + ')})}}res.sort((a,b)=>Math.abs(t-a.tot)-Math.abs(t-b.tot)||a.cnt-b.cnt);if(res.length===0){f.innerHTML=`<div style="padding:12px;text-align:center;color:var(--peony);font-size:13px;">⚠️ No matches fit range window.</div>`;return}f.innerHTML="";res.slice(0,20).forEach(m=>{let b=document.createElement('div');b.className='match';b.innerHTML=`<div class="m-meta"><span class="m-sum">$${m.tot.toFixed(2)}</span><span class="m-qty">${m.cnt} split</span></div><div class="m-det">${m.det}</div>`;f.appendChild(b)})}function drawGoals(){let b=document.getElementById('gFeed');if(!b)return;b.innerHTML="";if(goals.length===0){b.innerHTML=`<div style="padding:8px;text-align:center;color:var(--label);font-size:13px;">No current milestones.</div>`;return}goals.forEach((g,i)=>{let r=document.createElement('div');r.className='g-row';r.style.display='flex';r.style.justifyContent='space-between';r.innerHTML=`<span>🏁 &nbsp;${g}</span><button class="del" onclick="delMilestone(${i})">×</button>`;b.appendChild(r)});localStorage.setItem('g',JSON.stringify(goals))}function addMilestone(){let i=document.getElementById('gIn');if(i&&i.value.trim()!==""){goals.push(i.value.trim());i.value="";drawGoals()}}function delMilestone(i){goals.splice(i,1);drawGoals()}function exportStr(){let d={r:document.getElementById('rate').value,t:document.getElementById('tgt').value,o:document.getElementById('tol').value,p:document.getElementById('pool').value,g:goals};let s=btoa(JSON.stringify(d));navigator.clipboard.writeText(s).then(()=>alert("📋 Export code saved to clipboard!")).catch(()=>alert("Code:\n\n"+s))}function importStr(){let c=prompt("PASTE BACKUP STRING:");if(c){try{let d=JSON.parse(atob(c.trim()));if(d.r)document.getElementById('rate').value=d.r;if(d.t)document.getElementById('tgt').value=d.t;if(d.o)document.getElementById('tol').value=d.o;if(d.p)document.getElementById('pool').value=d.p;if(d.g)goals=d.g;calcProjections();matchEngine();drawGoals();alert("📥 Profile restored!")}catch(e){alert("❌ Format parse error.")}}}</script></body></html>
